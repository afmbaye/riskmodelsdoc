<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation - Power BI</title>
  <link rel="icon" type="image/png" href="../../Assets/Images/logos/baobab-icon.png">
  <link rel="stylesheet" href="../../Assets/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>

  <!-- Header (NavigationManager target) -->
  <!-- min-height:0 overrides the global 100vh so the empty wrapper
       doesn't push doc content down by a full viewport height -->
  <div class="layout-wrapper no-sidebar" id="layoutWrapper" style="min-height:0;grid-template-rows:auto;">
    <header class="header"><!-- Rendered by NavigationManager --></header>
  </div>

  <!-- Hidden sidebar anchor (prevents NavigationManager getElementById errors) -->
  <div id="sidebar" style="display:none"></div>

  <!-- Breadcrumb bar — sticky under header -->
  <div class="doc-breadcrumb-bar d-none" id="docBreadcrumbBar">
    <a href="../../index.html" class="doc-bc-link" id="docBcHomeLink">
      <i data-feather="arrow-left"></i>
      <span id="docBcHome">Accueil</span>
    </a>
    <i data-feather="chevron-right" class="doc-bc-sep"></i>
    <span class="doc-bc-model" id="docBcModel"></span>
  </div>

  <!-- Loading state -->
  <div class="doc-loading" id="loadingState">
    <div class="loading-spinner"></div>
  </div>

  <!-- Error state -->
  <div class="error-page d-none" id="errorState">
    <div class="error-icon"><i data-feather="alert-circle"></i></div>
    <h1 id="errorTitle">Modèle non trouvé</h1>
    <p id="errorDescription"></p>
    <a href="../../index.html" class="btn btn-primary" id="errorBackBtn">
      <i data-feather="arrow-left"></i>
      <span>Retour à l'accueil</span>
    </a>
  </div>

  <!-- One-page layout -->
  <div class="doc-page-wrapper d-none" id="docPageWrapper">
    <main class="doc-main" id="docMain">
      <!-- All sections rendered here dynamically -->
    </main>

    <!-- Floating TOC -->
    <aside class="doc-toc" id="docToc">
      <div class="doc-toc-title" id="tocTitle">Dans cette page</div>
      <nav class="doc-toc-nav" id="tocNav"></nav>
    </aside>
  </div>

  <!-- KPI Popover (portal, not in scroll flow) -->
  <div class="kpi-popover" id="kpiPopover">
    <button class="kpi-popover-close" id="kpiPopoverClose">
      <i data-feather="x"></i>
    </button>
    <div class="kpi-popover-name" id="kpiPopoverName"></div>
    <div class="kpi-popover-desc" id="kpiPopoverDesc"></div>
    <div class="kpi-popover-formula">
      <div class="kpi-popover-formula-toolbar">
        <span>DAX</span>
        <button class="btn btn-sm btn-ghost kpi-popover-copy-btn" id="kpiPopoverCopy">
          <i data-feather="copy"></i>
          <span id="kpiPopoverCopyLabel">Copier</span>
        </button>
      </div>
      <pre class="kpi-popover-formula-code"><code class="language-dax" id="kpiPopoverCode"></code></pre>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../../Assets/js/languageManager.js"></script>
  <script src="../../Assets/js/dataLoader.js"></script>
  <script src="../../Assets/js/templateRenderer.js"></script>
  <script src="../../Assets/js/navigationManager.js"></script>

  <script>
  /**
   * One-page Documentation Controller
   * Loads all 5 JSONs in parallel, renders all sections at once,
   * with floating TOC, accordion sections and KPI popovers.
   */
  const DocPage = {
    modelId: null,
    modelInfo: null,
    modelData: {},
    kpiIndex: {},

    // ─── Translation helper ───────────────────────────────────
    t(obj) { return LanguageManager.t.call(LanguageManager, obj); },

    // ─── Init ────────────────────────────────────────────────
    async init() {
      try {
        const params = new URLSearchParams(window.location.search);
        this.modelId = params.get('model');
        if (!this.modelId) { this.showError('no-model'); return; }

        const modelsIndex = await DataLoader.getModelsIndex();
        this.modelInfo = modelsIndex.models.find(m => m.id === this.modelId);
        if (!this.modelInfo)  { this.showError('not-found');  return; }
        if (!this.modelInfo.isActive) { this.showError('not-active'); return; }

        await this.loadAllData();
        this.buildKpiIndex();

        this.renderBreadcrumbBar();
        this.renderAllSections();
        this.renderToc();
        this.setupAccordions();
        this.setupScrollSpy();
        this.setupKpiPopovers();
        this.setupKpiSearch();
        this.setupDmTableAccordions();
        this.setupMiniToc();
        this.setupLanguageSwitch();

        document.getElementById('loadingState').classList.add('d-none');
        document.getElementById('docBreadcrumbBar').classList.remove('d-none');
        document.getElementById('docPageWrapper').classList.remove('d-none');

        feather.replace();
      } catch (err) {
        console.error('DocPage init error:', err);
        this.showError('load-error');
      }
    },

    // ─── Data loading ─────────────────────────────────────────
    async loadAllData() {
      const safeLoad = fn => fn.catch(() => null);
      const [overview, visuals, kpis, dataModel, update] = await Promise.all([
        DataLoader.getModelOverview(this.modelId),
        safeLoad(DataLoader.getModelVisuals(this.modelId)),
        safeLoad(DataLoader.getModelKpis(this.modelId)),
        safeLoad(DataLoader.getModelDataModel(this.modelId)),
        safeLoad(DataLoader.getModelUpdateProcess(this.modelId)),
      ]);
      this.modelData = { overview, visuals, kpis, dataModel, update };
    },

    buildKpiIndex() {
      this.kpiIndex = {};
      (this.modelData.kpis?.kpis || []).forEach(k => { this.kpiIndex[k.id] = k; });
    },

    // ─── Breadcrumb bar ───────────────────────────────────────
    renderBreadcrumbBar() {
      document.getElementById('docBcModel').textContent = this.t(this.modelInfo.name);
      document.getElementById('docBcHome').textContent = this.t({ fr: 'Accueil', en: 'Home' });
      document.title = `${this.t(this.modelInfo.name)} — Documentation`;
    },

    // ─── Section wrapper builder ──────────────────────────────
    buildSection(id, icon, title, subtitle, body, opts = {}) {
      const collapsed = opts.collapsed !== false;
      const noChevron = !!opts.noChevron;
      const titleText  = typeof title    === 'string' ? title    : this.t(title);
      const subText    = subtitle ? (typeof subtitle === 'string' ? subtitle : this.t(subtitle)) : '';
      return `
        <section class="doc-section ${collapsed ? 'collapsed' : ''} ${opts.cls || ''}"
                 id="sec-${id}">
          <div class="doc-section-header ${noChevron ? 'no-toggle' : ''}"
               data-section="${id}">
            <div class="doc-section-title-group">
              <div class="doc-section-icon">
                <i data-feather="${icon}"></i>
              </div>
              <div>
                <h2 class="doc-section-title">${titleText}</h2>
                ${subText ? `<p class="doc-section-subtitle">${subText}</p>` : ''}
              </div>
            </div>
            ${noChevron ? '' : `<i data-feather="chevron-down" class="doc-section-chevron"></i>`}
          </div>
          <div class="doc-section-body">${body}</div>
        </section>`;
    },

    // ─── Render all ───────────────────────────────────────────
    renderAllSections() {
      document.getElementById('docMain').innerHTML = [
        this.buildOverviewSection(),
        this.buildVisualsSection(),
        this.buildKpisSection(),
        this.buildDataModelSection(),
        this.buildUpdateSection(),
      ].filter(Boolean).join('');
    },

    // ─── OVERVIEW ─────────────────────────────────────────────
    buildOverviewSection() {
      const d = this.modelData.overview;
      const stats = (d.stats || []).map(s => `
        <div class="stat-card">
          <div class="stat-icon"><i data-feather="${s.icon}"></i></div>
          <div class="stat-content">
            <div class="stat-value">${s.value}</div>
            <div class="stat-label">${this.t(s.label)}</div>
          </div>
        </div>`).join('');

      const body = `
        <p class="overview-description">${this.t(d.description)}</p>
        <div class="content-grid-4 mt-4">${stats}</div>
        ${d.useCase ? `
          <div class="overview-use-case mt-6">
            <span class="overview-use-case-label">${this.t({ fr: 'Cas d\'utilisation', en: 'Use Case' })}</span>
            <p>${this.t(d.useCase)}</p>
          </div>` : ''}
        ${d.lastUpdate ? `
          <div class="alert alert-info mt-6">
            <i data-feather="clock" class="alert-icon"></i>
            <div class="alert-content">
              <div class="alert-title">${this.t({ fr: 'Dernière mise à jour', en: 'Last update' })}</div>
              <p class="alert-message">${d.lastUpdate}</p>
            </div>
          </div>` : ''}`;

      return this.buildSection(
        'overview', 'info',
        { fr: 'Vue d\'ensemble', en: 'Overview' }, null, body,
        { collapsed: false, noChevron: true, cls: 'overview' }
      );
    },

    // ─── VISUALS ──────────────────────────────────────────────
    buildVisualsSection() {
      const d = this.modelData.visuals;
      if (!d?.visuals?.length) return '';
      const count = d.visuals.length;

      const miniToc = `
        <div class="visual-mini-toc">
          ${d.visuals.map(v => `
            <button class="visual-mini-toc-chip" data-target="visual-${v.id}">
              ${this.t(v.name)}
            </button>`).join('')}
        </div>`;

      const articles = d.visuals.map((v, i) => this.buildVisualArticle(v, i)).join('');

      return this.buildSection(
        'visuals', 'layout',
        { fr: 'Visuels', en: 'Visuals' },
        { fr: `${count} onglet${count > 1 ? 's' : ''}`, en: `${count} tab${count > 1 ? 's' : ''}` },
        miniToc + articles
      );
    },

    buildVisualArticle(v, index) {
      const desc = this.t(v.description || v.objective || { fr: '', en: '' });
      const howToRead = this.t(v.howToRead || { fr: '', en: '' });

      // Filters: support both string[] and {name, description}[]
      const filterChips = (v.filters || []).map(f => {
        const name = typeof f === 'string' ? f : f.name;
        const tip  = typeof f === 'string' ? '' : this.t(f.description || { fr: '', en: '' });
        return `<span class="visual-filter-chip"${tip ? ` title="${tip}"` : ''}>${name}</span>`;
      }).join('');

      // KPI chips: support both `kpisUsed` (id strings) and `kpis` (id strings)
      const kpiIds = v.kpisUsed || v.kpis || [];
      const kpiChips = kpiIds.map(kid => {
        const kpi   = this.kpiIndex[kid];
        const label = kpi ? this.t(kpi.name) : kid;
        return `<button class="visual-kpi-chip" data-kpi-id="${kid}">${label}</button>`;
      }).join('');

      // Color coding: {fr,en} prose OR {color: {fr,en}} map
      let colorHtml = '';
      if (v.colorCoding) {
        const colorMap = { green:'#48BB78', red:'#F56565', orange:'#ED8936',
                           yellow:'#ECC94B', blue:'#4299E1', gray:'#A0AEC0', grey:'#A0AEC0' };
        if (v.colorCoding.fr || v.colorCoding.en) {
          colorHtml = `
            <div class="visual-color-coding">
              <span class="visual-meta-label">${this.t({ fr: 'Code couleur', en: 'Color coding' })}</span>
              <p class="color-coding-prose">${this.t(v.colorCoding)}</p>
            </div>`;
        } else {
          const dots = Object.entries(v.colorCoding).map(([c, m]) => `
            <span class="color-coding-item">
              <span class="color-coding-dot"
                    style="background:${colorMap[c.toLowerCase()] || c}"></span>
              <span>${this.t(m)}</span>
            </span>`).join('');
          colorHtml = `<div class="visual-color-coding">${dots}</div>`;
        }
      }

      return `
        <article class="visual-article" id="visual-${v.id}">
          <h3 class="visual-article-title">
            <span class="visual-article-number">${index + 1}</span>
            ${this.t(v.name)}
          </h3>
          ${desc       ? `<p class="visual-article-description">${desc}</p>` : ''}
          ${v.screenshot ? `
            <div class="visual-article-screenshot">
              <img src="../../${v.screenshot}" alt="${this.t(v.name)}" loading="lazy">
            </div>` : ''}
          ${howToRead  ? `<div class="visual-article-how-to-read">${howToRead}</div>` : ''}
          <div class="visual-meta-row">
            ${filterChips ? `
              <div class="visual-meta-group">
                <span class="visual-meta-label">${this.t({ fr: 'Filtres', en: 'Filters' })}</span>
                <div class="visual-filter-chips">${filterChips}</div>
              </div>` : ''}
            ${kpiChips ? `
              <div class="visual-meta-group">
                <span class="visual-meta-label">KPIs</span>
                <div class="visual-kpi-chips">${kpiChips}</div>
              </div>` : ''}
          </div>
          ${colorHtml}
        </article>`;
    },

    // ─── KPI DICTIONARY ───────────────────────────────────────
    buildKpisSection() {
      const d = this.modelData.kpis;
      if (!d?.kpis?.length) return '';

      const rows = d.kpis.map(k => `
        <tr data-kpi-id="${k.id}" id="kpi-row-${k.id}">
          <td class="kpi-name">${this.t(k.name)}</td>
          <td><code class="kpi-variable">${k.variableName || '—'}</code></td>
          <td class="kpi-description">${this.t(k.description)}</td>
          <td class="kpi-unit">${k.unit || '—'}</td>
          <td class="kpi-action">
            ${k.formula?.dax ? `
              <button class="view-formula-btn" data-kpi-id="${k.id}">
                <i data-feather="code"></i>
                ${this.t({ fr: 'Voir', en: 'View' })}
              </button>` : '—'}
          </td>
        </tr>`).join('');

      const body = `
        <div class="section-header mb-4">
          <span class="text-muted text-sm">
            ${d.kpis.length} ${this.t({ fr: 'indicateurs', en: 'indicators' })}
          </span>
          <div class="search-box">
            <i data-feather="search"></i>
            <input type="text" id="kpiSearchInput"
                   placeholder="${this.t({ fr: 'Rechercher un KPI...', en: 'Search KPI...' })}">
          </div>
        </div>
        <div class="table-wrapper" id="kpiTableWrapper">
          <table class="kpi-table" id="kpiTable">
            <thead>
              <tr>
                <th>${this.t({ fr: 'Nom', en: 'Name' })}</th>
                <th>${this.t({ fr: 'Variable', en: 'Variable' })}</th>
                <th>${this.t({ fr: 'Description', en: 'Description' })}</th>
                <th>${this.t({ fr: 'Unité', en: 'Unit' })}</th>
                <th>${this.t({ fr: 'Formule', en: 'Formula' })}</th>
              </tr>
            </thead>
            <tbody id="kpiTableBody">${rows}</tbody>
          </table>
        </div>
        <div class="empty-state d-none" id="kpiEmptyState">
          <i data-feather="search" class="empty-state-icon"></i>
          <h3 class="empty-state-title">${this.t({ fr: 'Aucun KPI trouvé', en: 'No KPI found' })}</h3>
        </div>`;

      return this.buildSection(
        'kpis', 'bar-chart-2',
        { fr: 'Dictionnaire KPIs', en: 'KPI Dictionary' },
        `${d.kpis.length} ${this.t({ fr: 'indicateurs', en: 'indicators' })}`,
        body
      );
    },

    // ─── DATA MODEL ───────────────────────────────────────────
    buildDataModelSection() {
      const dm       = this.modelData.dataModel;
      const overview = this.modelData.overview;
      if (!dm) return '';

      // Sources (from overview.json)
      let sourcesHtml = '';
      if (overview?.sources?.length) {
        const iconFor = type => ({ folder: 'folder', excel: 'file-text', csv: 'file' }[type] || 'database');
        const items = overview.sources.map(s => `
          <div class="source-item">
            <div class="source-icon">
              <i data-feather="${iconFor(s.type)}"></i>
            </div>
            <div class="source-body">
              <div class="source-name">${s.name}</div>
              <div class="source-desc">${this.t(s.description)}</div>
            </div>
          </div>`).join('');
        sourcesHtml = `
          <div class="dm-subsection" id="dm-sources">
            <h3 class="dm-subsection-title">
              <i data-feather="link"></i>
              ${this.t({ fr: 'Sources de données', en: 'Data Sources' })}
            </h3>
            <div class="sources-list">${items}</div>
          </div>`;
      }

      // Schema image
      let schemaHtml = '';
      if (dm.schema?.image) {
        schemaHtml = `
          <div class="dm-subsection" id="dm-schema">
            <h3 class="dm-subsection-title">
              <i data-feather="share-2"></i>
              ${this.t({ fr: 'Schéma', en: 'Schema' })}
            </h3>
            <div class="schema-image">
              <img src="../../${dm.schema.image}"
                   alt="${this.t({ fr: 'Schéma du modèle', en: 'Model schema' })}">
            </div>
          </div>`;
      }

      // Table accordion builder
      const buildTableItems = (tables, type) => tables.map(tbl => {
        const badge = type === 'fact'
          ? `<span class="badge badge-primary">Fact</span>`
          : `<span class="badge badge-info">Dimension</span>`;
        const colRows = (tbl.columns || []).map(col => `
          <tr>
            <td>${col.name}</td>
            <td><span class="col-type-badge">${col.type || ''}</span></td>
            <td class="text-muted">${this.t(col.description || { fr: '', en: '' })}</td>
          </tr>`).join('');
        return `
          <div class="dm-table-item">
            <div class="dm-table-header">
              <div class="dm-table-header-left">
                ${badge}
                <span class="dm-table-name">${tbl.name}</span>
                ${tbl.columns?.length
                  ? `<span class="dm-table-meta">${tbl.columns.length} col.</span>` : ''}
              </div>
              <i data-feather="chevron-down" class="dm-chevron"></i>
            </div>
            <div class="dm-table-body">
              ${tbl.description
                ? `<p class="dm-table-description">${this.t(tbl.description)}</p>` : ''}
              ${colRows ? `
                <table class="dm-columns-table">
                  <thead>
                    <tr>
                      <th>${this.t({ fr: 'Colonne', en: 'Column' })}</th>
                      <th>${this.t({ fr: 'Type', en: 'Type' })}</th>
                      <th>${this.t({ fr: 'Description', en: 'Description' })}</th>
                    </tr>
                  </thead>
                  <tbody>${colRows}</tbody>
                </table>` : ''}
            </div>
          </div>`;
      }).join('');

      const factTables = dm.tables?.fact || [];
      const dimTables  = dm.tables?.dimension || [];

      const tablesHtml = [
        factTables.length ? `
          <div class="dm-subsection" id="dm-fact-tables">
            <h3 class="dm-subsection-title">
              <i data-feather="database"></i>
              ${this.t({ fr: 'Tables de faits', en: 'Fact Tables' })} (${factTables.length})
            </h3>
            <div class="dm-table-group">${buildTableItems(factTables, 'fact')}</div>
          </div>` : '',
        dimTables.length ? `
          <div class="dm-subsection" id="dm-dim-tables">
            <h3 class="dm-subsection-title">
              <i data-feather="box"></i>
              ${this.t({ fr: 'Tables de dimensions', en: 'Dimension Tables' })} (${dimTables.length})
            </h3>
            <div class="dm-table-group">${buildTableItems(dimTables, 'dimension')}</div>
          </div>` : ''
      ].filter(Boolean).join('');

      // Relationships
      let relsHtml = '';
      if (dm.relationships?.length) {
        const relRows = dm.relationships.map(r => `
          <tr>
            <td><span class="rel-table-name">${r.from.table}</span></td>
            <td><code class="kpi-variable">${r.from.column}</code></td>
            <td style="text-align:center">
              <span class="cardinality-badge">${r.cardinality}</span>
            </td>
            <td><span class="rel-table-name">${r.to.table}</span></td>
            <td><code class="kpi-variable">${r.to.column}</code></td>
            <td class="rel-description">${this.t(r.description)}</td>
          </tr>`).join('');
        relsHtml = `
          <div class="dm-subsection" id="dm-relations">
            <h3 class="dm-subsection-title">
              <i data-feather="git-merge"></i>
              ${this.t({ fr: 'Relations', en: 'Relationships' })} (${dm.relationships.length})
            </h3>
            <div class="table-wrapper">
              <table class="data-table relationships-table">
                <thead>
                  <tr>
                    <th>${this.t({ fr: 'Table source', en: 'From' })}</th>
                    <th>${this.t({ fr: 'Colonne', en: 'Column' })}</th>
                    <th style="text-align:center">
                      ${this.t({ fr: 'Cardinalité', en: 'Cardinality' })}
                    </th>
                    <th>${this.t({ fr: 'Table cible', en: 'To' })}</th>
                    <th>${this.t({ fr: 'Colonne', en: 'Column' })}</th>
                    <th>${this.t({ fr: 'Description', en: 'Description' })}</th>
                  </tr>
                </thead>
                <tbody>${relRows}</tbody>
              </table>
            </div>
          </div>`;
      }

      const totalTables = factTables.length + dimTables.length;
      const relCount    = dm.relationships?.length || 0;
      return this.buildSection(
        'datamodel', 'database',
        { fr: 'Modèle de données', en: 'Data Model' },
        `${totalTables} tables · ${relCount} ${this.t({ fr: 'relations', en: 'relationships' })}`,
        sourcesHtml + schemaHtml + tablesHtml + relsHtml
      );
    },

    // ─── UPDATE PROCESS ───────────────────────────────────────
    buildUpdateSection() {
      const d = this.modelData.update;
      if (!d?.steps?.length) return '';

      const steps = d.steps.map((step, i) => {
        const tasks = (step.tasks || []).map(task => `
          <div class="task">
            <p>${this.t(task.description || task)}</p>
            ${(task.items || []).length
              ? `<ul>${task.items.map(it => `<li>${this.t(it)}</li>`).join('')}</ul>` : ''}
          </div>`).join('');

        const warnings = (step.warnings || []).map(w =>
          `<li><i data-feather="alert-triangle"></i> ${this.t(w)}</li>`).join('');

        const checklist = (step.checklist || []).map(c =>
          `<li><label><input type="checkbox"> ${this.t(c)}</label></li>`).join('');

        return `
          <div class="update-step" id="update-step-${i + 1}">
            <div class="update-step-indicator">
              <div class="update-step-number">${i + 1}</div>
            </div>
            <div class="update-step-body">
              <h3 class="update-step-title">
                ${this.t(step.title)}
                ${step.firstTimeOnly ? `
                  <span class="badge-first-time">
                    ${this.t({ fr: 'Première fois', en: 'First time only' })}
                  </span>` : ''}
              </h3>
              <p class="update-step-description">${this.t(step.description)}</p>
              ${tasks    ? `<div class="step-tasks">${tasks}</div>` : ''}
              ${step.screenshot ? `
                <div class="step-screenshot mt-4">
                  <img src="../../${step.screenshot}" alt="${this.t(step.title)}">
                </div>` : ''}
              ${warnings ? `<div class="step-warnings mt-4"><ul>${warnings}</ul></div>` : ''}
              ${checklist ? `
                <div class="step-checklist mt-4">
                  <h4>${this.t({ fr: 'Checklist', en: 'Checklist' })}</h4>
                  <ul class="checklist">${checklist}</ul>
                </div>` : ''}
            </div>
          </div>`;
      }).join('');

      const freqLabel = d.frequency ? this.t(d.frequency) : '';
      const durLabel  = d.estimatedDuration ? this.t(d.estimatedDuration) : '';
      const subtitle  = [
        `${d.steps.length} ${this.t({ fr: 'étapes', en: 'steps' })}`,
        freqLabel, durLabel
      ].filter(Boolean).join(' · ');

      return this.buildSection(
        'update', 'refresh-cw',
        { fr: 'Mise à jour', en: 'Update Process' },
        subtitle,
        `<div class="update-steps-list">${steps}</div>`
      );
    },

    // ─── TOC ─────────────────────────────────────────────────
    renderToc() {
      document.getElementById('tocTitle').textContent =
        this.t({ fr: 'Dans cette page', en: 'On this page' });

      const sections = [
        {
          id: 'overview',
          label: { fr: 'Vue d\'ensemble', en: 'Overview' },
          subs: []
        },
        {
          id: 'visuals',
          label: { fr: 'Visuels', en: 'Visuals' },
          subs: (this.modelData.visuals?.visuals || []).map(v => ({
            id: `visual-${v.id}`, label: this.t(v.name)
          }))
        },
        {
          id: 'kpis',
          label: { fr: 'KPI Dictionary', en: 'KPI Dictionary' },
          subs: []
        },
        {
          id: 'datamodel',
          label: { fr: 'Modèle de données', en: 'Data Model' },
          subs: this.buildDataModelTocSubs()
        },
        {
          id: 'update',
          label: { fr: 'Mise à jour', en: 'Update Process' },
          subs: (this.modelData.update?.steps || []).map((s, i) => ({
            id: `update-step-${i + 1}`,
            label: `${i + 1}. ${this.t(s.title)}`
          }))
        }
      ].filter(s => document.getElementById(`sec-${s.id}`));

      document.getElementById('tocNav').innerHTML = sections.map(s => `
        <div class="toc-group" data-section="${s.id}">
          <a class="toc-item toc-section"
             data-target="sec-${s.id}" href="#sec-${s.id}">
            ${this.t(s.label)}
          </a>
          ${s.subs.length ? `
            <div class="toc-subs" data-section="${s.id}">
              ${s.subs.map(sub => `
                <a class="toc-item toc-sub"
                   data-target="${sub.id}"
                   href="#${sub.id}"
                   title="${sub.label}">
                  ${sub.label}
                </a>`).join('')}
            </div>` : ''}
        </div>`).join('');

      // TOC click → expand section if collapsed + smooth scroll
      document.getElementById('tocNav').querySelectorAll('[data-target]').forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();
          const target = document.getElementById(link.dataset.target);
          if (!target) return;
          // Auto-expand parent section
          const parentSection = target.closest('.doc-section');
          if (parentSection?.classList.contains('collapsed')) {
            parentSection.classList.remove('collapsed');
            const sectionId = parentSection.id.replace('sec-', '');
            const tocSubs = document.querySelector(`.toc-subs[data-section="${sectionId}"]`);
            if (tocSubs) tocSubs.style.display = '';
            feather.replace();
          }
          // Smooth scroll with offset
          const offset = 60 + 48 + 20; // header + breadcrumb + gap
          const top = target.getBoundingClientRect().top + window.scrollY - offset;
          window.scrollTo({ top, behavior: 'smooth' });
        });
      });
    },

    buildDataModelTocSubs() {
      const subs    = [];
      const dm      = this.modelData.dataModel;
      const ov      = this.modelData.overview;
      if (ov?.sources?.length)        subs.push({ id: 'dm-sources',     label: this.t({ fr: 'Sources',           en: 'Sources'         }) });
      if (dm?.schema?.image)          subs.push({ id: 'dm-schema',      label: this.t({ fr: 'Schéma',            en: 'Schema'          }) });
      if (dm?.tables?.fact?.length)   subs.push({ id: 'dm-fact-tables', label: this.t({ fr: 'Tables (faits)',    en: 'Fact tables'     }) });
      if (dm?.tables?.dimension?.length) subs.push({ id: 'dm-dim-tables', label: this.t({ fr: 'Tables (dim.)',  en: 'Dim. tables'     }) });
      if (dm?.relationships?.length)  subs.push({ id: 'dm-relations',   label: this.t({ fr: 'Relations',        en: 'Relationships'   }) });
      return subs;
    },

    // ─── ACCORDIONS ───────────────────────────────────────────
    setupAccordions() {
      document.querySelectorAll('.doc-section-header:not(.no-toggle)').forEach(header => {
        header.addEventListener('click', () => {
          const section   = header.closest('.doc-section');
          const sectionId = header.dataset.section;
          section.classList.toggle('collapsed');
          // Sync TOC sub-items visibility
          const tocSubs = document.querySelector(`.toc-subs[data-section="${sectionId}"]`);
          if (tocSubs) tocSubs.style.display = section.classList.contains('collapsed') ? 'none' : '';
          feather.replace();
        });
      });
      // Initial TOC sub-item visibility (collapsed sections → hidden subs)
      document.querySelectorAll('.toc-subs').forEach(el => {
        const sec = document.getElementById(`sec-${el.dataset.section}`);
        if (sec?.classList.contains('collapsed')) el.style.display = 'none';
      });
    },

    // ─── SCROLL SPY ───────────────────────────────────────────
    setupScrollSpy() {
      const allTocItems = () => document.querySelectorAll('.toc-item');
      const activate = id => {
        allTocItems().forEach(item => {
          item.classList.toggle('active', item.dataset.target === id);
        });
      };

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) activate(entry.target.id);
        });
      }, { rootMargin: `-${60 + 48}px 0px -60% 0px`, threshold: 0 });

      // Observe section headers and sub-elements
      ['sec-overview','sec-visuals','sec-kpis','sec-datamodel','sec-update'].forEach(id => {
        const el = document.getElementById(id);
        if (el) observer.observe(el);
      });
      document.querySelectorAll('.visual-article, .update-step, .dm-subsection')
        .forEach(el => observer.observe(el));
    },

    // ─── KPI POPOVERS ─────────────────────────────────────────
    setupKpiPopovers() {
      const popover = document.getElementById('kpiPopover');

      document.addEventListener('click', e => {
        const chip = e.target.closest('.visual-kpi-chip');
        const btn  = e.target.closest('.view-formula-btn');
        if (chip || btn) {
          e.stopPropagation();
          this.showKpiPopover((chip || btn).dataset.kpiId, chip || btn);
          return;
        }
        if (!popover.contains(e.target)) this.hideKpiPopover();
      });

      document.getElementById('kpiPopoverClose').addEventListener('click',
        () => this.hideKpiPopover());

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') this.hideKpiPopover();
      });

      document.getElementById('kpiPopoverCopy').addEventListener('click', () => {
        const code  = document.getElementById('kpiPopoverCode').textContent;
        const label = document.getElementById('kpiPopoverCopyLabel');
        navigator.clipboard.writeText(code).then(() => {
          label.textContent = this.t({ fr: 'Copié !', en: 'Copied!' });
          setTimeout(() => {
            label.textContent = this.t({ fr: 'Copier', en: 'Copy' });
          }, 2000);
        }).catch(() => {});
      });
    },

    showKpiPopover(kpiId, anchor) {
      const kpi = this.kpiIndex[kpiId];
      if (!kpi) return;

      document.getElementById('kpiPopoverName').textContent = this.t(kpi.name);
      document.getElementById('kpiPopoverDesc').textContent = this.t(kpi.description);
      document.getElementById('kpiPopoverCopyLabel').textContent = this.t({ fr: 'Copier', en: 'Copy' });

      const codeEl = document.getElementById('kpiPopoverCode');
      codeEl.textContent = kpi.formula?.dax || this.t({ fr: 'Formule non disponible', en: 'Formula not available' });
      if (Prism && kpi.formula?.dax) Prism.highlightElement(codeEl);

      const popover = document.getElementById('kpiPopover');
      popover.classList.add('visible');
      feather.replace();

      // Dynamic positioning
      const rect   = anchor.getBoundingClientRect();
      const popW   = 360;
      const popH   = 260;
      let left = rect.left;
      let top  = rect.bottom + 8;

      if (left + popW > window.innerWidth - 16) left = window.innerWidth - popW - 16;
      if (left < 16) left = 16;
      if (top + popH > window.innerHeight - 16) top = rect.top - popH - 8;

      popover.style.left = `${left}px`;
      popover.style.top  = `${top}px`;
    },

    hideKpiPopover() {
      document.getElementById('kpiPopover').classList.remove('visible');
    },

    // ─── KPI SEARCH ───────────────────────────────────────────
    setupKpiSearch() {
      const input = document.getElementById('kpiSearchInput');
      if (!input) return;
      input.addEventListener('input', () => {
        const term = input.value.toLowerCase();
        let count = 0;
        document.querySelectorAll('#kpiTableBody tr').forEach(row => {
          const kpi = this.kpiIndex[row.dataset.kpiId];
          if (!kpi) { row.classList.add('d-none'); return; }
          const match =
            this.t(kpi.name).toLowerCase().includes(term) ||
            this.t(kpi.description).toLowerCase().includes(term) ||
            (kpi.variableName || '').toLowerCase().includes(term);
          row.classList.toggle('d-none', !match);
          if (match) count++;
        });
        document.getElementById('kpiTableWrapper')?.classList.toggle('d-none', count === 0);
        document.getElementById('kpiEmptyState')?.classList.toggle('d-none', count > 0);
      });
    },

    // ─── DATA MODEL TABLE ACCORDIONS ─────────────────────────
    setupDmTableAccordions() {
      document.querySelectorAll('.dm-table-header').forEach(header => {
        header.addEventListener('click', () => {
          header.closest('.dm-table-item').classList.toggle('open');
          feather.replace();
        });
      });
    },

    // ─── MINI-TOC (visuals section) ───────────────────────────
    setupMiniToc() {
      document.querySelectorAll('.visual-mini-toc-chip[data-target]').forEach(chip => {
        chip.addEventListener('click', () => {
          const target = document.getElementById(chip.dataset.target);
          if (!target) return;
          const offset = 60 + 48 + 20;
          const top = target.getBoundingClientRect().top + window.scrollY - offset;
          window.scrollTo({ top, behavior: 'smooth' });
        });
      });
    },

    // ─── LANGUAGE SWITCH ─────────────────────────────────────
    setupLanguageSwitch() {
      window.addEventListener('languageChanged', async () => {
        await this.loadAllData();
        this.buildKpiIndex();
        this.renderBreadcrumbBar();
        this.renderAllSections();
        this.renderToc();
        this.setupAccordions();
        this.setupScrollSpy();
        this.setupKpiPopovers();
        this.setupKpiSearch();
        this.setupDmTableAccordions();
        this.setupMiniToc();
        feather.replace();
      });
    },

    // ─── ERROR ────────────────────────────────────────────────
    showError(type) {
      document.getElementById('loadingState').classList.add('d-none');
      document.getElementById('errorState').classList.remove('d-none');
      const errors = {
        'no-model':   { title: { fr: 'Aucun modèle spécifié', en: 'No model specified'        }, desc: { fr: 'Sélectionnez un modèle depuis l\'accueil.', en: 'Select a model from the home page.' } },
        'not-found':  { title: { fr: 'Modèle non trouvé',     en: 'Model not found'            }, desc: { fr: 'Ce modèle n\'existe pas.',                  en: 'This model does not exist.'          } },
        'not-active': { title: { fr: 'Documentation en cours', en: 'Documentation in progress' }, desc: { fr: 'Ce modèle n\'est pas encore documenté.',    en: 'This model is not yet documented.'   } },
        'load-error': { title: { fr: 'Erreur de chargement',  en: 'Loading error'              }, desc: { fr: 'Impossible de charger les données.',         en: 'Unable to load data.'                } }
      };
      const err = errors[type] || errors['load-error'];
      document.getElementById('errorTitle').textContent       = this.t(err.title);
      document.getElementById('errorDescription').textContent = this.t(err.desc);
      document.getElementById('errorBackBtn').innerHTML =
        `<i data-feather="arrow-left"></i><span>${this.t({ fr: 'Retour à l\'accueil', en: 'Back to home' })}</span>`;
      feather.replace();
    }
  };

  document.addEventListener('DOMContentLoaded', () => DocPage.init());
  </script>
</body>
