<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Flow - Risk Models Documentation</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../Assets/Images/logos/baobab-icon.png">

  <!-- Styles -->
  <link rel="stylesheet" href="../Assets/css/main.css">

  <!-- Feather Icons -->
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>
  <div class="layout-wrapper no-sidebar" id="layoutWrapper" style="min-height:0;grid-template-rows:auto;">
    <!-- Header -->
    <header class="header">
      <!-- Rendered by NavigationManager -->
    </header>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Hero -->
      <section class="hero-section hero-compact hero-data-flow">
        <div class="hero-content">
          <h1 class="hero-title" id="pageTitle">Data Flow</h1>
          <p class="hero-description" id="pageDescription">
            Vue d'ensemble du flux de données depuis les fichiers sources jusqu'aux modèles Power BI.
          </p>
        </div>
      </section>

      <!-- Content -->
      <section class="content-section">
        <div id="dfLoading" style="text-align:center;padding:var(--spacing-10);color:var(--text-muted);">
          <i data-feather="loader" style="width:24px;height:24px;margin-bottom:var(--spacing-3);display:block;margin-inline:auto;"></i>
          <span id="dfLoadingLabel">Chargement…</span>
        </div>

        <div id="dfApp" style="display:none;">

          <!-- Two-panel layout -->
          <div class="df-layout">

            <!-- LEFT: Source panel -->
            <div class="df-source-panel">
              <div class="df-source-panel-header">
                <p class="df-source-panel-title" id="panelTitle">Sources de données</p>
                <input
                  type="search"
                  class="df-source-search"
                  id="dfSearch"
                  placeholder="Rechercher une source…"
                  aria-label="Rechercher une source"
                >
              </div>
              <div class="df-source-panel-body" id="dfSourceList">
                <!-- Rendered by JS -->
              </div>
            </div>

            <!-- RIGHT: Model grid -->
            <div class="df-main">

              <!-- Category filter chips -->
              <div class="df-main-toolbar">
                <span class="df-main-toolbar-label" id="filterLabel">Filtrer :</span>
                <div class="df-category-chips" id="dfCategoryChips">
                  <!-- Rendered by JS -->
                </div>
                <button class="df-clear-btn" id="dfClearBtn" style="display:none;" aria-label="Réinitialiser la sélection">
                  <i data-feather="x"></i>
                  <span id="clearLabel">Réinitialiser</span>
                </button>
              </div>

              <!-- Selection info banner -->
              <div class="df-selection-info" id="dfSelectionInfo" role="status">
                <i data-feather="info"></i>
                <span id="dfSelectionText"></span>
              </div>

              <!-- Model grid -->
              <div class="df-model-grid" id="dfModelGrid">
                <!-- Rendered by JS -->
              </div>

              <!-- Source detail (shown on source click) -->
              <div class="df-source-detail" id="dfSourceDetail">
                <div class="df-source-detail-header">
                  <div class="df-source-detail-icon" id="dfDetailIcon">
                    <i data-feather="file-text"></i>
                  </div>
                  <div class="df-source-detail-meta">
                    <h3 id="dfDetailName"></h3>
                    <span class="df-source-detail-pattern" id="dfDetailPattern"></span>
                  </div>
                </div>
                <p class="df-source-detail-desc" id="dfDetailDesc"></p>
              </div>

            </div>
          </div>

        </div>
      </section>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../Assets/js/languageManager.js"></script>
  <script src="../Assets/js/dataLoader.js"></script>
  <script src="../Assets/js/navigationManager.js"></script>

  <script>
    /* ──────────────────────────────────────────────────────
       Data Flow Page Controller
    ────────────────────────────────────────────────────── */
    const DataFlowPage = {
      sources: [],
      models: [],
      categories: [],
      selectedSource: null,
      selectedModel: null,
      activeCategory: 'all',
      searchQuery: '',

      // ── Bootstrap ──────────────────────────────────────
      async init() {
        try {
          const prefix = NavigationManager.getPathPrefix();
          const [dfData, modelsData, catsData] = await Promise.all([
            fetch(`${prefix}data/data-flow.json`).then(r => r.json()),
            fetch(`${prefix}data/models/index.json`).then(r => r.json()),
            fetch(`${prefix}data/categories.json`).then(r => r.json())
          ]);

          this.sources    = dfData.sources || [];
          this.models     = (modelsData.models || []).filter(m => m.isActive);
          this.categories = catsData.categories || [];

          this.renderAll();
          this.setupSearch();
          this.setupLanguageSwitch();

          document.getElementById('dfLoading').style.display = 'none';
          document.getElementById('dfApp').style.display     = 'block';
          feather.replace();
        } catch (err) {
          console.error('DataFlowPage init error:', err);
          document.getElementById('dfLoadingLabel').textContent = 'Erreur de chargement.';
        }
      },

      // ── Translate helper ───────────────────────────────
      t(obj) {
        const lang = (document.documentElement.lang || 'fr');
        if (!obj) return '';
        return obj[lang] || obj.fr || obj.en || '';
      },

      // ── Render all ────────────────────────────────────
      renderAll() {
        this.updateStaticLabels();
        this.renderCategoryChips();
        this.renderSourcePanel();
        this.renderModelGrid();
        this.renderClearBtn();
      },

      // ── Static labels (bilingual) ──────────────────────
      updateStaticLabels() {
        const t = this.t.bind(this);
        document.getElementById('pageTitle').textContent       = t({ fr: 'Data Flow', en: 'Data Flow' });
        document.getElementById('pageDescription').textContent = t({
          fr: 'Vue d\'ensemble du flux de données depuis les fichiers sources jusqu\'aux modèles Power BI.',
          en: 'Overview of the data flow from source files to the Power BI models.'
        });
        document.getElementById('panelTitle').textContent  = t({ fr: 'Sources de données', en: 'Data Sources' });
        document.getElementById('filterLabel').textContent = t({ fr: 'Filtrer :', en: 'Filter:' });
        document.getElementById('clearLabel').textContent  = t({ fr: 'Réinitialiser', en: 'Reset' });
        const searchEl = document.getElementById('dfSearch');
        if (searchEl) searchEl.placeholder = t({ fr: 'Rechercher une source…', en: 'Search a source…' });
      },

      // ── Category chips ────────────────────────────────
      renderCategoryChips() {
        const t   = this.t.bind(this);
        const usedCatIds = new Set(this.models.flatMap(m => m.categories || []));
        const usedCats   = this.categories.filter(c => usedCatIds.has(c.id));

        const allChip = `<button class="df-category-chip${this.activeCategory === 'all' ? ' active' : ''}" data-cat="all">${t({ fr: 'Tous', en: 'All' })}</button>`;
        const chips   = usedCats.map(c =>
          `<button class="df-category-chip${this.activeCategory === c.id ? ' active' : ''}" data-cat="${c.id}">${t(c.label)}</button>`
        ).join('');

        const container = document.getElementById('dfCategoryChips');
        container.innerHTML = allChip + chips;
        container.addEventListener('click', e => {
          const btn = e.target.closest('.df-category-chip');
          if (!btn) return;
          this.activeCategory  = btn.dataset.cat;
          this.selectedSource  = null;
          this.selectedModel   = null;
          this.renderAll();
          feather.replace();
        });
      },

      // ── Source panel ──────────────────────────────────
      renderSourcePanel() {
        const t = this.t.bind(this);

        // Group sources by type
        const groups = {
          csv:     { label: t({ fr: 'Fichiers CSV', en: 'CSV Files' }), items: [] },
          mapping: { label: t({ fr: 'Fichiers de mapping', en: 'Mapping Files' }), items: [] },
          xlsx:    { label: t({ fr: 'Fichiers Excel', en: 'Excel Files' }), items: [] },
          folder:  { label: t({ fr: 'Dossiers / Rapports', en: 'Folders / Reports' }), items: [] }
        };

        const q = this.searchQuery.toLowerCase();

        this.sources.forEach(src => {
          const name = t(src.name).toLowerCase();
          const desc = t(src.description || {}).toLowerCase();
          if (q && !name.includes(q) && !desc.includes(q)) return;
          const group = groups[src.type] || groups.xlsx;
          group.items.push(src);
        });

        let html = '';
        Object.entries(groups).forEach(([type, g]) => {
          if (!g.items.length) return;
          html += `<div class="df-source-group">`;
          html += `<div class="df-source-group-label">${g.label}</div>`;
          g.items.forEach(src => {
            const isActive      = this.selectedSource === src.id;
            const isHighlighted = !isActive && this.selectedModel && src.models.includes(this.selectedModel);
            const isDimmed      = (this.selectedModel && !src.models.includes(this.selectedModel)) ||
                                  (this.activeCategory !== 'all' && !src.models.some(mid => {
                                    const m = this.models.find(x => x.id === mid);
                                    return m && (m.categories || []).includes(this.activeCategory);
                                  }));

            let cls = 'df-source-item';
            if (isActive)      cls += ' active';
            else if (isHighlighted) cls += ' highlighted';
            else if (isDimmed) cls += ' dimmed';

            const connectedCount = src.models.filter(mid => this.models.find(x => x.id === mid)).length;

            html += `
              <div class="${cls}" data-source-id="${src.id}" role="button" tabindex="0"
                   aria-pressed="${isActive}">
                <i data-feather="${src.icon || 'file'}" class="df-source-item-icon df-type-${type}"></i>
                <div class="df-source-item-text">
                  <div class="df-source-item-name">${t(src.name)}</div>
                  <div class="df-source-item-pattern">${src.pattern || ''}</div>
                </div>
                <span class="df-source-item-count">${connectedCount}</span>
              </div>`;
          });
          html += `</div>`;
        });

        if (!html) {
          html = `<div style="padding:var(--spacing-4);text-align:center;color:var(--text-light);font-size:var(--font-size-sm);">${t({ fr: 'Aucun résultat', en: 'No results' })}</div>`;
        }

        const list = document.getElementById('dfSourceList');
        list.innerHTML = html;

        list.querySelectorAll('.df-source-item').forEach(el => {
          el.addEventListener('click', () => this.selectSource(el.dataset.sourceId));
          el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') this.selectSource(el.dataset.sourceId); });
        });
      },

      // ── Model grid ────────────────────────────────────
      renderModelGrid() {
        const t = this.t.bind(this);

        // Filter models by category
        let filtered = this.models;
        if (this.activeCategory !== 'all') {
          filtered = filtered.filter(m => (m.categories || []).includes(this.activeCategory));
        }

        let html = '';
        if (!filtered.length) {
          html = `<div class="df-empty-state"><i data-feather="inbox"></i><p>${t({ fr: 'Aucun modèle dans cette catégorie.', en: 'No model in this category.' })}</p></div>`;
        } else {
          filtered.forEach(model => {
            const srcForModel   = this.sources.filter(s => s.models.includes(model.id));
            const isActive      = this.selectedModel === model.id;
            const isHighlighted = !isActive && this.selectedSource && this.sources.find(s => s.id === this.selectedSource)?.models.includes(model.id);
            const isDimmed      = (this.selectedSource && !this.sources.find(s => s.id === this.selectedSource)?.models.includes(model.id)) ||
                                  (this.selectedModel && this.selectedModel !== model.id);

            let cls = 'df-model-card';
            if (isActive)           cls += ' active';
            else if (isHighlighted) cls += ' highlighted';
            else if (isDimmed)      cls += ' dimmed';

            const cats = (model.categories || []).slice(0, 3).map(cid => {
              const c = this.categories.find(x => x.id === cid);
              return `<span class="df-model-cat-tag">${c ? t(c.label) : cid}</span>`;
            }).join('');

            const srcLabel = t({ fr: `${srcForModel.length} source${srcForModel.length > 1 ? 's' : ''}`, en: `${srcForModel.length} source${srcForModel.length > 1 ? 's' : ''}` });

            html += `
              <div class="${cls}" data-model-id="${model.id}" role="button" tabindex="0"
                   aria-pressed="${isActive}">
                <div class="df-model-card-icon">
                  <i data-feather="bar-chart-2"></i>
                </div>
                <div class="df-model-card-name">${t(model.name)}</div>
                <div class="df-model-card-sources">${srcLabel}</div>
                <div class="df-model-card-cats">${cats}</div>
              </div>`;
          });
        }

        const grid = document.getElementById('dfModelGrid');
        grid.innerHTML = html;

        grid.querySelectorAll('.df-model-card').forEach(el => {
          el.addEventListener('click', () => this.selectModel(el.dataset.modelId));
          el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') this.selectModel(el.dataset.modelId); });
        });
      },

      // ── Selection logic ───────────────────────────────
      selectSource(id) {
        if (this.selectedSource === id) {
          this.clearSelection();
          return;
        }
        this.selectedSource = id;
        this.selectedModel  = null;
        this.renderSourcePanel();
        this.renderModelGrid();
        this.renderSelectionInfo();
        this.renderSourceDetail(id);
        this.renderClearBtn();
        feather.replace();
      },

      selectModel(id) {
        if (this.selectedModel === id) {
          this.clearSelection();
          return;
        }
        this.selectedModel  = id;
        this.selectedSource = null;
        this.renderSourcePanel();
        this.renderModelGrid();
        this.renderSelectionInfo();
        this.hideSourceDetail();
        this.renderClearBtn();
        feather.replace();
      },

      clearSelection() {
        this.selectedSource = null;
        this.selectedModel  = null;
        this.renderSourcePanel();
        this.renderModelGrid();
        this.hideSelectionInfo();
        this.hideSourceDetail();
        this.renderClearBtn();
        feather.replace();
      },

      // ── Selection banner ──────────────────────────────
      renderSelectionInfo() {
        const t = this.t.bind(this);
        const banner = document.getElementById('dfSelectionInfo');
        const text   = document.getElementById('dfSelectionText');

        if (this.selectedSource) {
          const src = this.sources.find(s => s.id === this.selectedSource);
          if (!src) return;
          const count = src.models.filter(mid => this.models.find(m => m.id === mid)).length;
          text.textContent = t({
            fr: `Source « ${t(src.name)} » → utilisée par ${count} modèle${count > 1 ? 's' : ''}. Cliquez un modèle pour voir ses sources.`,
            en: `Source "${t(src.name)}" → used by ${count} model${count > 1 ? 's' : ''}. Click a model to see its sources.`
          });
        } else if (this.selectedModel) {
          const model = this.models.find(m => m.id === this.selectedModel);
          if (!model) return;
          const srcs = this.sources.filter(s => s.models.includes(this.selectedModel));
          text.textContent = t({
            fr: `Modèle « ${t(model.name)} » → ${srcs.length} source${srcs.length > 1 ? 's' : ''} identifiée${srcs.length > 1 ? 's' : ''}. Cliquez une source pour plus de détails.`,
            en: `Model "${t(model.name)}" → ${srcs.length} identified source${srcs.length > 1 ? 's' : ''}. Click a source for more details.`
          });
        }

        banner.classList.add('visible');
      },

      hideSelectionInfo() {
        document.getElementById('dfSelectionInfo').classList.remove('visible');
      },

      // ── Source detail panel ───────────────────────────
      renderSourceDetail(sourceId) {
        const t   = this.t.bind(this);
        const src = this.sources.find(s => s.id === sourceId);
        if (!src) return;

        document.getElementById('dfDetailName').textContent    = t(src.name);
        document.getElementById('dfDetailPattern').textContent = src.pattern || '';
        document.getElementById('dfDetailDesc').textContent    = t(src.description);

        const iconEl = document.getElementById('dfDetailIcon');
        iconEl.innerHTML = `<i data-feather="${src.icon || 'file'}"></i>`;

        document.getElementById('dfSourceDetail').classList.add('visible');
        feather.replace();
      },

      hideSourceDetail() {
        document.getElementById('dfSourceDetail').classList.remove('visible');
      },

      // ── Clear button visibility ───────────────────────
      renderClearBtn() {
        const t   = this.t.bind(this);
        const btn = document.getElementById('dfClearBtn');
        const hasSelection = this.selectedSource || this.selectedModel;
        btn.style.display = hasSelection ? 'flex' : 'none';
        btn.onclick = () => this.clearSelection();
      },

      // ── Search ───────────────────────────────────────
      setupSearch() {
        const input = document.getElementById('dfSearch');
        if (!input) return;
        input.addEventListener('input', () => {
          this.searchQuery = input.value.trim();
          this.renderSourcePanel();
          feather.replace();
        });
      },

      // ── Language switch ───────────────────────────────
      setupLanguageSwitch() {
        window.addEventListener('languageChanged', () => {
          this.renderAll();
          feather.replace();
        });
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      DataFlowPage.init();
    });
  </script>
</body>
</html>
