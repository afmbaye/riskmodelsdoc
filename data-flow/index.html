<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Flow - Risk Models Documentation</title>
  <link rel="icon" type="image/png" href="../Assets/Images/logos/baobab-icon.png">
  <link rel="stylesheet" href="../Assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>

  <style>
    /* ═══ Data Flow layout ══════════════════════════════════ */
    .df-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: var(--spacing-6);
      align-items: start;
      padding: var(--spacing-6) 0;
    }

    /* ── Model panel (left) ─────────────────────────────── */
    .df-model-panel {
      position: sticky;
      top: calc(var(--header-height, 64px) + var(--spacing-4));
      max-height: calc(100vh - var(--header-height, 64px) - 80px);
      display: flex;
      flex-direction: column;
      background: var(--bg-white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .df-model-panel-header {
      padding: var(--spacing-3) var(--spacing-4);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .df-model-panel-title {
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0 0 var(--spacing-2);
    }

    .df-cat-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .df-cat-chip {
      font-size: 10px;
      padding: 2px 8px;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: var(--bg-white);
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }

    .df-cat-chip:hover  { border-color: var(--primary-color); color: var(--primary-color); }
    .df-cat-chip.active { background: var(--primary-color); border-color: var(--primary-color); color: white; }

    .df-model-panel-body {
      overflow-y: auto;
      flex: 1;
    }

    /* Model list rows */
    .df-model-all-row,
    .df-model-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-2);
      padding: var(--spacing-2) var(--spacing-4);
      cursor: pointer;
      transition: background var(--transition-fast);
      border-bottom: 1px solid var(--border-color);
    }

    .df-model-all-row:hover,
    .df-model-row:hover   { background: var(--bg-gray-50); }

    .df-model-all-row.active,
    .df-model-row.active  { background: var(--primary-light); }

    .df-model-row-icon {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      background: var(--bg-gray-100);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .df-model-row-icon svg, .df-model-row-icon i { width: 12px; height: 12px; }

    .df-model-row.active .df-model-row-icon { background: var(--primary-color); color: white; }
    .df-model-all-row.active .df-model-row-icon { background: var(--primary-color); color: white; }

    .df-model-row-text { flex: 1; min-width: 0; }

    .df-model-row-name {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--text-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .df-model-row.active .df-model-row-name,
    .df-model-all-row.active .df-model-row-name { color: var(--primary-color); font-weight: var(--font-weight-semibold); }

    .df-model-row-cats { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 2px; }

    .df-model-row-cat {
      font-size: 9px;
      padding: 0 4px;
      border-radius: 3px;
      background: var(--bg-gray-100);
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .df-model-src-count {
      font-size: 10px;
      font-weight: 600;
      background: var(--bg-gray-100);
      color: var(--text-muted);
      padding: 1px 6px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .df-model-row.active .df-model-src-count,
    .df-model-all-row.active .df-model-src-count { background: var(--primary-color); color: white; }

    /* ── Source area (right) ────────────────────────────── */
    .df-source-area { min-width: 0; }

    .df-source-area-header {
      display: flex;
      align-items: center;
      gap: var(--spacing-3);
      margin-bottom: var(--spacing-5);
      flex-wrap: wrap;
    }

    .df-source-area-title {
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semibold);
      color: var(--text-color);
      flex: 1;
    }

    .df-source-area-subtitle {
      font-size: var(--font-size-sm);
      color: var(--text-muted);
      margin-top: 2px;
    }

    .df-source-search {
      width: 220px;
      padding: var(--spacing-2) var(--spacing-3);
      font-size: var(--font-size-sm);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-gray-50);
      color: var(--text-color);
      outline: none;
      transition: border-color var(--transition-fast);
      flex-shrink: 0;
    }

    .df-source-search:focus { border-color: var(--primary-color); background: var(--bg-white); }

    /* Source grid */
    .df-source-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: var(--spacing-4);
    }

    /* Source card */
    .df-source-card {
      background: var(--bg-white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--spacing-4);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-2);
    }

    .df-source-card:hover {
      border-color: var(--primary-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transform: translateY(-1px);
    }

    .df-source-card-top {
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-3);
    }

    .df-source-card-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .df-source-card-icon svg, .df-source-card-icon i { width: 18px; height: 18px; }

    /* Category color coding (4 categories) */
    .df-icon-data        { background: #dbeafe; color: #1d4ed8; }
    .df-icon-consolidated{ background: #dcfce7; color: #15803d; }
    .df-icon-mapping     { background: #f3f4f6; color: #374151; }
    .df-icon-other       { background: #fef9c3; color: #854d0e; }

    .df-source-card-meta { flex: 1; min-width: 0; }

    .df-source-card-name {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--text-color);
      line-height: 1.3;
      margin-bottom: 2px;
    }

    .df-source-card-pattern {
      font-size: 10px;
      color: var(--text-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .df-source-card-origin {
      display: inline-flex;
      align-items: center;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 1px 6px;
      border-radius: 3px;
      margin-top: 2px;
    }

    .df-badge-data        { background: #dbeafe; color: #1d4ed8; }
    .df-badge-consolidated{ background: #dcfce7; color: #15803d; }
    .df-badge-mapping     { background: #f3f4f6; color: #374151; }
    .df-badge-other       { background: #fef9c3; color: #854d0e; }

    /* Subcategory badge (for "other" sources) */
    .df-source-subcat {
      display: inline-flex;
      align-items: center;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 1px 6px;
      border-radius: 3px;
      background: #f3f4f6;
      color: #6b7280;
      margin-left: 4px;
    }

    /* Source category filter chips (right area) */
    .df-src-cat-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: var(--spacing-4);
    }

    .df-src-cat-chip {
      font-size: 11px;
      padding: 4px 12px;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: var(--bg-white);
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
      font-weight: var(--font-weight-medium);
    }

    .df-src-cat-chip:hover  { border-color: var(--primary-color); color: var(--primary-color); }
    .df-src-cat-chip.active { background: var(--primary-color); border-color: var(--primary-color); color: white; }

    .df-source-card-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .df-source-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: var(--spacing-1);
    }

    .df-source-card-granularity {
      font-size: 10px;
      color: var(--text-light);
      font-style: italic;
    }

    .df-source-card-detail-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--primary-color);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 0;
      font-weight: var(--font-weight-medium);
      transition: opacity var(--transition-fast);
    }

    .df-source-card-detail-btn:hover { opacity: 0.75; }
    .df-source-card-detail-btn svg, .df-source-card-detail-btn i { width: 12px; height: 12px; }

    /* Empty state */
    .df-empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: var(--spacing-12);
      color: var(--text-light);
    }

    .df-empty-state i, .df-empty-state svg { width: 32px; height: 32px; opacity: 0.35; display: block; margin: 0 auto var(--spacing-3); }

    /* ── Slide panel (right sidebar) ────────────────────── */
    .df-panel-origin-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: var(--spacing-4);
    }

    .df-panel-origin-badge.data         { background: #dbeafe; color: #1d4ed8; }
    .df-panel-origin-badge.consolidated { background: #dcfce7; color: #15803d; }
    .df-panel-origin-badge.mapping      { background: #f3f4f6; color: #374151; }
    .df-panel-origin-badge.other        { background: #fef9c3; color: #854d0e; }

    .df-panel-desc {
      font-size: var(--font-size-sm);
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: var(--spacing-5);
    }

    .df-panel-section {
      margin-bottom: var(--spacing-5);
    }

    .df-panel-section-title {
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0 0 var(--spacing-3);
      padding-bottom: var(--spacing-2);
      border-bottom: 1px solid var(--border-color);
    }

    .df-panel-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-3);
    }

    .df-panel-meta-item {}

    .df-panel-meta-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .df-panel-meta-value {
      font-size: var(--font-size-sm);
      color: var(--text-color);
    }

    .df-panel-pattern {
      font-family: var(--font-mono, 'Courier New', monospace);
      font-size: 11px;
      background: var(--bg-gray-50);
      padding: var(--spacing-2) var(--spacing-3);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      word-break: break-all;
      display: block;
      margin-top: var(--spacing-1);
    }

    .df-panel-model-chips { display: flex; flex-wrap: wrap; gap: var(--spacing-2); }

    .df-panel-model-chip {
      font-size: var(--font-size-xs);
      padding: var(--spacing-1) var(--spacing-2);
      background: var(--primary-light);
      color: var(--primary-color);
      border-radius: var(--radius-sm);
      font-weight: var(--font-weight-medium);
    }

    .df-columns-table { width: 100%; border-collapse: collapse; font-size: 11px; }

    .df-columns-table th {
      text-align: left;
      font-weight: 600;
      color: var(--text-muted);
      padding: var(--spacing-2) var(--spacing-3);
      background: var(--bg-gray-50);
      border-bottom: 1px solid var(--border-color);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .df-columns-table td {
      padding: var(--spacing-2) var(--spacing-3);
      border-bottom: 1px solid var(--border-color);
      color: var(--text-color);
      vertical-align: top;
    }

    .df-columns-table tr:last-child td { border-bottom: none; }

    .df-col-name { font-family: var(--font-mono, monospace); font-weight: 600; color: var(--primary-color); font-size: 11px; }

    .df-col-type {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      background: var(--bg-gray-100);
      color: var(--text-muted);
      padding: 1px 5px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .df-col-desc { color: var(--text-muted); font-size: 11px; }

    .df-columns-empty {
      text-align: center;
      padding: var(--spacing-5);
      color: var(--text-light);
      font-size: var(--font-size-sm);
      background: var(--bg-gray-50);
      border-radius: var(--radius-md);
    }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 1024px) {
      .df-layout { grid-template-columns: 1fr; }
      .df-model-panel { position: static; max-height: 280px; }
      .df-source-search { width: 100%; }
    }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="layout-wrapper no-sidebar" id="layoutWrapper" style="min-height:0;grid-template-rows:auto;">
    <header class="header"></header>

    <main class="main-content">
      <section class="hero-section hero-compact hero-data-flow">
        <div class="hero-content">
          <h1 class="hero-title" id="pageTitle">Data Flow</h1>
          <p class="hero-description" id="pageDescription"></p>
        </div>
      </section>

      <section class="content-section">
        <div id="dfLoading" style="text-align:center;padding:var(--spacing-10);color:var(--text-muted);">
          <i data-feather="loader" style="width:24px;height:24px;display:block;margin:0 auto var(--spacing-3);animation:spin 1s linear infinite;"></i>
          <span>Chargement…</span>
        </div>

        <div id="dfApp" style="display:none;">
          <div class="df-layout">

            <!-- LEFT: Model panel -->
            <div class="df-model-panel">
              <div class="df-model-panel-header">
                <p class="df-model-panel-title" id="modelPanelTitle">Modèles</p>
                <div class="df-cat-filter" id="dfCatFilter"></div>
              </div>
              <div class="df-model-panel-body" id="dfModelList"></div>
            </div>

            <!-- RIGHT: Sources area -->
            <div class="df-source-area">
              <div class="df-source-area-header">
                <div>
                  <div class="df-source-area-title" id="srcAreaTitle">Sources de données</div>
                  <div class="df-source-area-subtitle" id="srcAreaSubtitle"></div>
                </div>
                <input type="search" class="df-source-search" id="dfSrcSearch" placeholder="Rechercher une source…">
              </div>
              <div class="df-src-cat-filter" id="dfSrcCatFilter"></div>
              <div class="df-source-grid" id="dfSourceGrid"></div>
            </div>

          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Right slide panel (source detail) -->
  <div class="slide-panel-overlay" id="panelOverlay"></div>
  <div class="slide-panel" id="sourcePanel">
    <div class="slide-panel-header">
      <h3 class="slide-panel-title" id="spTitle">Source</h3>
      <button class="slide-panel-close" id="spClose" aria-label="Fermer">
        <i data-feather="x"></i>
      </button>
    </div>
    <div class="slide-panel-body" id="spBody"></div>
  </div>

  <script src="../Assets/js/languageManager.js"></script>
  <script src="../Assets/js/dataLoader.js"></script>
  <script src="../Assets/js/navigationManager.js"></script>

  <script>
    const DataFlowPage = {
      sources: [],
      models: [],
      categories: [],
      selectedModel: 'all',
      activeCategory: 'all',
      activeSourceCategory: 'all',
      searchQuery: '',

      // ── Init ──────────────────────────────────────────────
      async init() {
        try {
          const prefix = NavigationManager.getPathPrefix();
          const [dfData, modelsData, catsData] = await Promise.all([
            fetch(`${prefix}data/data-flow.json`).then(r => r.json()),
            fetch(`${prefix}data/models/index.json`).then(r => r.json()),
            fetch(`${prefix}data/categories.json`).then(r => r.json())
          ]);

          this.sources    = dfData.sources || [];
          this.models     = (modelsData.models || []).filter(m => m.isActive);
          this.categories = catsData.categories || [];

          this.renderAll();
          this.setupSearch();
          this.setupPanel();
          this.setupLanguageSwitch();

          document.getElementById('dfLoading').style.display = 'none';
          document.getElementById('dfApp').style.display = 'block';
          feather.replace();
        } catch (err) {
          console.error('DataFlowPage error:', err);
          document.getElementById('dfLoading').innerHTML = '<p style="color:var(--error-color)">Erreur de chargement.</p>';
        }
      },

      t(obj) {
        const lang = document.documentElement.lang || 'fr';
        if (!obj) return '';
        return obj[lang] || obj.fr || obj.en || '';
      },

      renderAll() {
        this.updateLabels();
        this.renderCategoryFilter();
        this.renderModelList();
        this.renderSourceCategoryFilter();
        this.renderSourceGrid();
      },

      updateLabels() {
        const t = this.t.bind(this);
        document.getElementById('pageTitle').textContent       = t({ fr: 'Data Flow', en: 'Data Flow' });
        document.getElementById('pageDescription').textContent = t({ fr: 'Vue d\'ensemble du flux de données depuis les fichiers sources jusqu\'aux modèles Power BI.', en: 'Overview of the data flow from source files to the Power BI models.' });
        document.getElementById('modelPanelTitle').textContent = t({ fr: 'Modèles', en: 'Models' });
        const s = document.getElementById('dfSrcSearch');
        if (s) s.placeholder = t({ fr: 'Rechercher une source…', en: 'Search a source…' });
      },

      // ── Source category filter (above source grid) ───────
      renderSourceCategoryFilter() {
        const t = this.t.bind(this);
        const srcCats = [
          { id: 'all',          label: { fr: 'Toutes', en: 'All' } },
          { id: 'data',         label: { fr: 'Data',   en: 'Data' } },
          { id: 'consolidated', label: { fr: 'Consolidated', en: 'Consolidated' } },
          { id: 'mapping',      label: { fr: 'Mappings', en: 'Mappings' } },
          { id: 'other',        label: { fr: 'Autre',  en: 'Other' } }
        ];

        const container = document.getElementById('dfSrcCatFilter');
        if (!container) return;

        container.innerHTML = srcCats.map(c =>
          `<button class="df-src-cat-chip${this.activeSourceCategory === c.id ? ' active' : ''}" data-src-cat="${c.id}">${t(c.label)}</button>`
        ).join('');

        container.addEventListener('click', e => {
          const btn = e.target.closest('.df-src-cat-chip');
          if (!btn) return;
          this.activeSourceCategory = btn.dataset.srcCat;
          this.renderSourceCategoryFilter();
          this.renderSourceGrid();
          feather.replace();
        });
      },

      // ── Category filter (above model list) ───────────────
      renderCategoryFilter() {
        const t          = this.t.bind(this);
        const usedCatIds = new Set(this.models.flatMap(m => m.categories || []));
        const usedCats   = this.categories.filter(c => usedCatIds.has(c.id));

        const allBtn = `<button class="df-cat-chip${this.activeCategory === 'all' ? ' active' : ''}" data-cat="all">${t({ fr: 'Tous', en: 'All' })}</button>`;
        const chips  = usedCats.map(c =>
          `<button class="df-cat-chip${this.activeCategory === c.id ? ' active' : ''}" data-cat="${c.id}">${t(c.label)}</button>`
        ).join('');

        const container = document.getElementById('dfCatFilter');
        container.innerHTML = allBtn + chips;
        container.addEventListener('click', e => {
          const btn = e.target.closest('.df-cat-chip');
          if (!btn) return;
          this.activeCategory = btn.dataset.cat;
          this.selectedModel  = 'all';
          this.renderAll();
          feather.replace();
        });
      },

      // ── Model list (left panel) ───────────────────────────
      renderModelList() {
        const t = this.t.bind(this);

        let filteredModels = this.models;
        if (this.activeCategory !== 'all') {
          filteredModels = filteredModels.filter(m => (m.categories || []).includes(this.activeCategory));
        }

        const totalSources  = this.sources.length;
        const allActive     = this.selectedModel === 'all';

        let html = `
          <div class="df-model-all-row${allActive ? ' active' : ''}" data-model="all" role="button" tabindex="0">
            <div class="df-model-row-icon"><i data-feather="grid"></i></div>
            <div class="df-model-row-text">
              <div class="df-model-row-name">${t({ fr: 'Tous les modèles', en: 'All models' })}</div>
            </div>
            <span class="df-model-src-count">${totalSources}</span>
          </div>`;

        filteredModels.forEach(model => {
          const srcCount = this.sources.filter(s => s.models.includes(model.id)).length;
          const isActive = this.selectedModel === model.id;
          const cats     = (model.categories || []).slice(0, 2).map(cid => {
            const c = this.categories.find(x => x.id === cid);
            return `<span class="df-model-row-cat">${c ? t(c.label) : cid}</span>`;
          }).join('');

          html += `
            <div class="df-model-row${isActive ? ' active' : ''}" data-model="${model.id}" role="button" tabindex="0">
              <div class="df-model-row-icon"><i data-feather="bar-chart-2"></i></div>
              <div class="df-model-row-text">
                <div class="df-model-row-name">${t(model.name)}</div>
                <div class="df-model-row-cats">${cats}</div>
              </div>
              <span class="df-model-src-count">${srcCount}</span>
            </div>`;
        });

        const list = document.getElementById('dfModelList');
        list.innerHTML = html;

        list.querySelectorAll('[data-model]').forEach(el => {
          el.addEventListener('click', () => {
            this.selectedModel = el.dataset.model;
            this.renderModelList();
            this.renderSourceGrid();
            feather.replace();
          });
          el.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { this.selectedModel = el.dataset.model; this.renderModelList(); this.renderSourceGrid(); feather.replace(); }
          });
        });
      },

      // ── Source grid (right area) ──────────────────────────
      renderSourceGrid() {
        const t   = this.t.bind(this);
        const q   = this.searchQuery.toLowerCase();

        // Filter sources
        let sources = this.selectedModel === 'all'
          ? this.sources
          : this.sources.filter(s => s.models.includes(this.selectedModel));

        if (this.activeCategory !== 'all') {
          const catModelIds = new Set(
            this.models.filter(m => (m.categories || []).includes(this.activeCategory)).map(m => m.id)
          );
          sources = sources.filter(s => s.models.some(mid => catModelIds.has(mid)));
        }

        // Filter by source category
        if (this.activeSourceCategory !== 'all') {
          sources = sources.filter(s => s.category === this.activeSourceCategory);
        }

        if (q) {
          sources = sources.filter(s =>
            t(s.name).toLowerCase().includes(q) ||
            (s.pattern || '').toLowerCase().includes(q) ||
            t(s.description || {}).toLowerCase().includes(q)
          );
        }

        // Update header
        const model = this.models.find(m => m.id === this.selectedModel);
        if (this.selectedModel === 'all') {
          document.getElementById('srcAreaTitle').textContent    = t({ fr: 'Sources de données', en: 'Data Sources' });
          document.getElementById('srcAreaSubtitle').textContent = t({ fr: `${sources.length} sources au total`, en: `${sources.length} sources total` });
        } else if (model) {
          document.getElementById('srcAreaTitle').textContent    = t({ fr: `Sources — ${t(model.name)}`, en: `Sources — ${t(model.name)}` });
          document.getElementById('srcAreaSubtitle').textContent = t({ fr: `${sources.length} source${sources.length > 1 ? 's' : ''} identifiée${sources.length > 1 ? 's' : ''}`, en: `${sources.length} source${sources.length > 1 ? 's' : ''} identified` });
        }

        const catLabels = {
          data:         { fr: 'La Data',     en: 'La Data' },
          consolidated: { fr: 'Consolidé',   en: 'Consolidated' },
          mapping:      { fr: 'Mapping',     en: 'Mapping' },
          other:        { fr: 'Autre',       en: 'Other' }
        };

        const catIcons = {
          data:         'database',
          consolidated: 'layers',
          mapping:      'map',
          other:        'external-link'
        };

        let html = '';
        if (!sources.length) {
          html = `<div class="df-empty-state"><i data-feather="inbox"></i><p>${t({ fr: 'Aucune source pour ce filtre.', en: 'No source for this filter.' })}</p></div>`;
        } else {
          sources.forEach(src => {
            const cat         = src.category || 'other';
            const iconClass   = `df-icon-${cat}`;
            const badgeClass  = `df-badge-${cat}`;
            const badgeLabel  = t(catLabels[cat] || { fr: cat, en: cat });
            const featherIcon = catIcons[cat] || 'file';
            const granularity = t(src.granularity);
            const subcatBadge = (cat === 'other' && src.subcategory)
              ? `<span class="df-source-subcat">${src.subcategory}</span>`
              : '';

            html += `
              <div class="df-source-card" data-source-id="${src.id}">
                <div class="df-source-card-top">
                  <div class="df-source-card-icon ${iconClass}">
                    <i data-feather="${featherIcon}"></i>
                  </div>
                  <div class="df-source-card-meta">
                    <div class="df-source-card-name">${t(src.name)}</div>
                    <div class="df-source-card-pattern">${src.pattern || ''}</div>
                    <span class="df-source-card-origin ${badgeClass}">${badgeLabel}</span>${subcatBadge}
                  </div>
                </div>
                <div class="df-source-card-desc">${t(src.description)}</div>
                <div class="df-source-card-footer">
                  <span class="df-source-card-granularity">${granularity ? '⊞ ' + granularity : ''}</span>
                  <button class="df-source-card-detail-btn" data-source-id="${src.id}" aria-label="${t({ fr: 'Voir détails', en: 'View details' })}">
                    ${t({ fr: 'Détails', en: 'Details' })} <i data-feather="chevron-right"></i>
                  </button>
                </div>
              </div>`;
          });
        }

        const grid = document.getElementById('dfSourceGrid');
        grid.innerHTML = html;

        // Only detail button opens panel — card click does nothing else
        grid.querySelectorAll('.df-source-card-detail-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            this.openPanel(btn.dataset.sourceId);
          });
        });
      },

      // ── Right slide panel ─────────────────────────────────
      setupPanel() {
        const close = () => {
          document.getElementById('sourcePanel').classList.remove('show');
          document.getElementById('panelOverlay').classList.remove('show');
        };
        document.getElementById('spClose').addEventListener('click', close);
        document.getElementById('panelOverlay').addEventListener('click', close);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
      },

      openPanel(sourceId) {
        const t   = this.t.bind(this);
        const src = this.sources.find(s => s.id === sourceId);
        if (!src) return;

        const cat = src.category || 'other';
        const catLabels = {
          data:         { fr: 'Depuis la Data (dossier partagé)',           en: 'From Data team (shared folder)' },
          consolidated: { fr: 'Données consolidées — équipe Risk/Analytics', en: 'Consolidated — Risk/Analytics team' },
          mapping:      { fr: 'Fichier de mapping (référentiel local)',      en: 'Mapping file (local reference)' },
          other:        { fr: src.subcategory ? `Autre — ${src.subcategory}` : 'Autre', en: src.subcategory ? `Other — ${src.subcategory}` : 'Other' }
        };

        const connectedModels = this.models.filter(m => src.models.includes(m.id));
        const modelChips      = connectedModels.map(m =>
          `<span class="df-panel-model-chip">${t(m.name)}</span>`
        ).join('') || '—';

        const cols = src.columns || [];
        let colsHtml;
        if (cols.length) {
          colsHtml = `<table class="df-columns-table">
            <thead><tr>
              <th>${t({ fr: 'Colonne', en: 'Column' })}</th>
              <th>${t({ fr: 'Type', en: 'Type' })}</th>
              <th>${t({ fr: 'Description', en: 'Description' })}</th>
            </tr></thead>
            <tbody>${cols.map(c => `
              <tr>
                <td><span class="df-col-name">${c.name}</span></td>
                <td><span class="df-col-type">${c.type}</span></td>
                <td class="df-col-desc">${t(c.description)}</td>
              </tr>`).join('')}
            </tbody>
          </table>`;
        } else {
          colsHtml = `<div class="df-columns-empty">${t({ fr: 'Colonnes non documentées pour cette source.', en: 'Columns not yet documented for this source.' })}</div>`;
        }

        document.getElementById('spTitle').textContent = t(src.name);
        document.getElementById('spBody').innerHTML = `
          <span class="df-panel-origin-badge ${cat}">${t(catLabels[cat])}</span>

          <p class="df-panel-desc">${t(src.description)}</p>

          <div class="df-panel-section">
            <p class="df-panel-section-title">${t({ fr: 'Informations', en: 'Information' })}</p>
            <div class="df-panel-meta-grid">
              <div class="df-panel-meta-item">
                <div class="df-panel-meta-label">${t({ fr: 'Fréquence', en: 'Frequency' })}</div>
                <div class="df-panel-meta-value">${t(src.updateFrequency) || '—'}</div>
              </div>
              <div class="df-panel-meta-item">
                <div class="df-panel-meta-label">${t({ fr: 'Granularité', en: 'Granularity' })}</div>
                <div class="df-panel-meta-value">${t(src.granularity) || '—'}</div>
              </div>
            </div>
            <div style="margin-top:var(--spacing-3)">
              <div class="df-panel-meta-label">${t({ fr: 'Pattern fichier', en: 'File pattern' })}</div>
              <code class="df-panel-pattern">${src.pattern || '—'}</code>
            </div>
          </div>

          <div class="df-panel-section">
            <p class="df-panel-section-title">${t({ fr: 'Modèles utilisant cette source', en: 'Models using this source' })}</p>
            <div class="df-panel-model-chips">${modelChips}</div>
          </div>

          <div class="df-panel-section">
            <p class="df-panel-section-title">${t({ fr: 'Colonnes principales', en: 'Main columns' })}</p>
            ${colsHtml}
          </div>
        `;

        document.getElementById('sourcePanel').classList.add('show');
        document.getElementById('panelOverlay').classList.add('show');
        feather.replace();
      },

      // ── Search ────────────────────────────────────────────
      setupSearch() {
        const input = document.getElementById('dfSrcSearch');
        if (!input) return;
        input.addEventListener('input', () => {
          this.searchQuery = input.value.trim();
          this.renderSourceGrid();
          feather.replace();
        });
      },

      // ── Language switch ───────────────────────────────────
      setupLanguageSwitch() {
        window.addEventListener('languageChanged', () => {
          this.renderAll();
          feather.replace();
        });
      }
    };

    document.addEventListener('DOMContentLoaded', () => { DataFlowPage.init(); });
  </script>
</body>
</html>
