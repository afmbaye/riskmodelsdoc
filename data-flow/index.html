<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Flow - Risk Models Documentation</title>
  <link rel="icon" type="image/png" href="../Assets/Images/logos/baobab-icon.png">
  <link rel="stylesheet" href="../Assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>

  <style>
    /* ═══ Data Flow layout ══════════════════════════════════ */
    .df-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: var(--spacing-6);
      align-items: start;
      padding: var(--spacing-6) 0;
    }

    /* ── Model panel (left) ─────────────────────────────── */
    .df-model-panel {
      position: sticky;
      top: calc(var(--header-height, 64px) + var(--spacing-4));
      max-height: calc(100vh - var(--header-height, 64px) - 80px);
      display: flex;
      flex-direction: column;
      background: var(--bg-white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .df-model-panel-header {
      padding: var(--spacing-3) var(--spacing-4);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .df-model-panel-title {
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0;
    }

    .df-model-panel-body {
      overflow-y: auto;
      flex: 1;
    }

    /* Model list rows */
    .df-model-all-row,
    .df-model-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-2);
      padding: var(--spacing-2) var(--spacing-4);
      cursor: pointer;
      transition: background var(--transition-fast);
      border-bottom: 1px solid var(--border-color);
    }

    .df-model-all-row:hover,
    .df-model-row:hover   { background: var(--bg-gray-50); }

    .df-model-all-row.active,
    .df-model-row.active  { background: var(--primary-light); }

    .df-model-row-icon {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      background: var(--bg-gray-100);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .df-model-row-icon svg, .df-model-row-icon i { width: 12px; height: 12px; }

    .df-model-row.active .df-model-row-icon { background: var(--primary-color); color: white; }
    .df-model-all-row.active .df-model-row-icon { background: var(--primary-color); color: white; }

    .df-model-row-text { flex: 1; min-width: 0; }

    .df-model-row-name {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--text-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .df-model-row.active .df-model-row-name,
    .df-model-all-row.active .df-model-row-name { color: var(--primary-color); font-weight: var(--font-weight-semibold); }

    .df-model-row-cats { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 2px; }

    .df-model-row-cat {
      font-size: 9px;
      padding: 0 4px;
      border-radius: 3px;
      background: var(--bg-gray-100);
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .df-model-src-count {
      font-size: 10px;
      font-weight: 600;
      background: var(--bg-gray-100);
      color: var(--text-muted);
      padding: 1px 6px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .df-model-row.active .df-model-src-count,
    .df-model-all-row.active .df-model-src-count { background: var(--primary-color); color: white; }

    /* ── Source area (right) ────────────────────────────── */
    .df-source-area { min-width: 0; }

    .df-source-area-header {
      display: flex;
      align-items: center;
      gap: var(--spacing-3);
      margin-bottom: var(--spacing-5);
      flex-wrap: wrap;
    }

    .df-source-area-title {
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semibold);
      color: var(--text-color);
      flex: 1;
    }

    .df-source-area-subtitle {
      font-size: var(--font-size-sm);
      color: var(--text-muted);
      margin-top: 2px;
    }

    .df-source-search {
      width: 220px;
      padding: var(--spacing-2) var(--spacing-3);
      font-size: var(--font-size-sm);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-gray-50);
      color: var(--text-color);
      outline: none;
      transition: border-color var(--transition-fast);
      flex-shrink: 0;
    }

    .df-source-search:focus { border-color: var(--primary-color); background: var(--bg-white); }

    /* Source grid */
    .df-source-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: var(--spacing-4);
    }

    /* Source card */
    .df-source-card {
      background: var(--bg-white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--spacing-4);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-2);
    }

    .df-source-card:hover {
      border-color: var(--primary-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transform: translateY(-1px);
    }

    .df-source-card-top {
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-3);
    }

    .df-source-card-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .df-source-card-icon svg, .df-source-card-icon i { width: 18px; height: 18px; }

    /* Category color coding (4 categories) */
    .df-icon-data        { background: #dbeafe; color: #1d4ed8; }
    .df-icon-consolidated{ background: #dcfce7; color: #15803d; }
    .df-icon-mapping     { background: #f3f4f6; color: #374151; }
    .df-icon-other       { background: #fef9c3; color: #854d0e; }

    .df-source-card-meta { flex: 1; min-width: 0; }

    .df-source-card-name {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--text-color);
      line-height: 1.3;
      margin-bottom: 2px;
    }

    .df-source-card-pattern {
      font-size: 10px;
      color: var(--text-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .df-source-card-origin {
      display: inline-flex;
      align-items: center;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 1px 6px;
      border-radius: 3px;
      margin-top: 2px;
    }

    .df-badge-data        { background: #dbeafe; color: #1d4ed8; }
    .df-badge-consolidated{ background: #dcfce7; color: #15803d; }
    .df-badge-mapping     { background: #f3f4f6; color: #374151; }
    .df-badge-other       { background: #fef9c3; color: #854d0e; }

    /* Subcategory badge (for "other" sources) */
    .df-source-subcat {
      display: inline-flex;
      align-items: center;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 1px 6px;
      border-radius: 3px;
      background: #f3f4f6;
      color: #6b7280;
      margin-left: 4px;
    }

    /* Source category filter chips (right area) */
    .df-src-cat-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: var(--spacing-4);
    }

    .df-src-cat-chip {
      font-size: 11px;
      padding: 4px 12px;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: var(--bg-white);
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
      font-weight: var(--font-weight-medium);
    }

    .df-src-cat-chip:hover  { border-color: var(--primary-color); color: var(--primary-color); }
    .df-src-cat-chip.active { background: var(--primary-color); border-color: var(--primary-color); color: white; }

    .df-source-card-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .df-source-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: var(--spacing-1);
    }

    .df-source-card-granularity {
      font-size: 10px;
      color: var(--text-light);
      font-style: italic;
    }

    .df-source-card-detail-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--primary-color);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 0;
      font-weight: var(--font-weight-medium);
      transition: opacity var(--transition-fast);
    }

    .df-source-card-detail-btn:hover { opacity: 0.75; }
    .df-source-card-detail-btn svg, .df-source-card-detail-btn i { width: 12px; height: 12px; }

    /* Empty state */
    .df-empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: var(--spacing-12);
      color: var(--text-light);
    }

    .df-empty-state i, .df-empty-state svg { width: 32px; height: 32px; opacity: 0.35; display: block; margin: 0 auto var(--spacing-3); }

    /* ── Slide panel (right sidebar) ────────────────────── */
    .df-panel-origin-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: var(--spacing-4);
    }

    .df-panel-origin-badge.data         { background: #dbeafe; color: #1d4ed8; }
    .df-panel-origin-badge.consolidated { background: #dcfce7; color: #15803d; }
    .df-panel-origin-badge.mapping      { background: #f3f4f6; color: #374151; }
    .df-panel-origin-badge.other        { background: #fef9c3; color: #854d0e; }

    .df-panel-desc {
      font-size: var(--font-size-sm);
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: var(--spacing-5);
    }

    .df-panel-section {
      margin-bottom: var(--spacing-5);
    }

    .df-panel-section-title {
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0 0 var(--spacing-3);
      padding-bottom: var(--spacing-2);
      border-bottom: 1px solid var(--border-color);
    }

    .df-panel-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-3);
    }

    .df-panel-meta-item {}

    .df-panel-meta-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .df-panel-meta-value {
      font-size: var(--font-size-sm);
      color: var(--text-color);
    }

    .df-panel-pattern {
      font-family: var(--font-mono, 'Courier New', monospace);
      font-size: 11px;
      background: var(--bg-gray-50);
      padding: var(--spacing-2) var(--spacing-3);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      word-break: break-all;
      display: block;
      margin-top: var(--spacing-1);
    }

    .df-panel-model-chips { display: flex; flex-wrap: wrap; gap: var(--spacing-2); }

    .df-panel-model-chip {
      font-size: var(--font-size-xs);
      padding: var(--spacing-1) var(--spacing-2);
      background: var(--primary-light);
      color: var(--primary-color);
      border-radius: var(--radius-sm);
      font-weight: var(--font-weight-medium);
    }

    .df-columns-table { width: 100%; border-collapse: collapse; font-size: 11px; }

    .df-columns-table th {
      text-align: left;
      font-weight: 600;
      color: var(--text-muted);
      padding: var(--spacing-2) var(--spacing-3);
      background: var(--bg-gray-50);
      border-bottom: 1px solid var(--border-color);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .df-columns-table td {
      padding: var(--spacing-2) var(--spacing-3);
      border-bottom: 1px solid var(--border-color);
      color: var(--text-color);
      vertical-align: top;
    }

    .df-columns-table tr:last-child td { border-bottom: none; }

    .df-col-name { font-family: var(--font-mono, monospace); font-weight: 600; color: var(--primary-color); font-size: 11px; }

    .df-col-type {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      background: var(--bg-gray-100);
      color: var(--text-muted);
      padding: 1px 5px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .df-col-desc { color: var(--text-muted); font-size: 11px; }

    .df-columns-empty {
      text-align: center;
      padding: var(--spacing-5);
      color: var(--text-light);
      font-size: var(--font-size-sm);
      background: var(--bg-gray-50);
      border-radius: var(--radius-md);
    }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 1024px) {
      .df-layout { grid-template-columns: 1fr; }
      .df-model-panel { position: static; max-height: 280px; }
      .df-source-search { width: 100%; }
    }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="layout-wrapper no-sidebar" id="layoutWrapper" style="min-height:0;grid-template-rows:auto;">
    <header class="header"></header>

    <main class="main-content">
      <section class="hero-section hero-compact hero-data-flow">
        <div class="hero-content">
          <h1 class="hero-title" id="pageTitle">Data Flow</h1>
          <p class="hero-description" id="pageDescription"></p>
        </div>
      </section>

      <section class="content-section">
        <div id="dfLoading" style="text-align:center;padding:var(--spacing-10);color:var(--text-muted);">
          <i data-feather="loader" style="width:24px;height:24px;display:block;margin:0 auto var(--spacing-3);animation:spin 1s linear infinite;"></i>
          <span>Chargement…</span>
        </div>

        <div id="dfApp" style="display:none;">
          <div class="df-layout">

            <!-- LEFT: Model panel -->
            <div class="df-model-panel">
              <div class="df-model-panel-header">
                <p class="df-model-panel-title" id="modelPanelTitle">Modèles</p>
              </div>
              <div class="df-model-panel-body" id="dfModelList"></div>
            </div>

            <!-- RIGHT: Sources area -->
            <div class="df-source-area">
              <div class="df-source-area-header">
                <div>
                  <div class="df-source-area-title" id="srcAreaTitle">Sources de données</div>
                  <div class="df-source-area-subtitle" id="srcAreaSubtitle"></div>
                </div>
                <input type="search" class="df-source-search" id="dfSrcSearch" placeholder="Rechercher une source…">
              </div>
              <div class="df-src-cat-filter" id="dfSrcCatFilter"></div>
              <div class="df-source-grid" id="dfSourceGrid"></div>
            </div>

          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Right slide panel (source detail) -->
  <div class="slide-panel-overlay" id="panelOverlay"></div>
  <div class="slide-panel" id="sourcePanel">
    <div class="slide-panel-header">
      <h3 class="slide-panel-title" id="spTitle">Source</h3>
      <button class="slide-panel-close" id="spClose" aria-label="Fermer">
        <i data-feather="x"></i>
      </button>
    </div>
    <div class="slide-panel-body" id="spBody"></div>
  </div>

  <script src="../Assets/js/languageManager.js"></script>
  <script src="../Assets/js/dataLoader.js"></script>
  <script src="../Assets/js/navigationManager.js"></script>
  <script src="../Assets/js/dataFlowPage.js"></script>

</body>
</html>
